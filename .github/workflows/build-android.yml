name: Build Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK à générer (release nécessite les secrets de signature)
        type: choice
        default: debug
        options: [debug, release]
      device_tests:
        description: Tester sur émulateurs Android 10 et 15
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NART_ANDROID_APPLICATION_ID: ${{ vars.NART_ANDROID_APPLICATION_ID }}
      NART_ANDROID_APP_NAME: ${{ vars.NART_ANDROID_APP_NAME }}
      NART_ANDROID_URL_SCHEME: ${{ vars.NART_ANDROID_URL_SCHEME }}
      NART_ANDROID_APP_LINK_HOST: ${{ vars.NART_ANDROID_APP_LINK_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Configure application
        run: |
          cp .env.example .env
          echo "VITE_APP_SCHEME=${NART_ANDROID_URL_SCHEME:-nartya}" >> .env
          echo "VITE_SITE_URL=https://${NART_ANDROID_APP_LINK_HOST:-nartya.app}" >> .env
      - name: Lint and web unit tests
        run: |
          npm run lint
          npm run test:unit
      - name: Build web and sync Android
        run: npm run android:sync
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - name: Check minified release
        working-directory: android
        run: bash ./gradlew assembleRelease -PnartyaAllowUnsignedRelease=true --console=plain
      - name: Configure release signing
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.NART_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NART_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NART_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NART_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          for key in ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'):
              if not os.environ.get(key):
                  raise SystemExit(f'Secret de signature manquant : {key}')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'nart-release.jks'
          path.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'NART_KEYSTORE_PATH={path}\n')
          PY
      - name: Build signed release
        if: inputs.variant == 'release'
        working-directory: android
        env:
          NART_STORE_PASSWORD: ${{ secrets.NART_STORE_PASSWORD }}
          NART_KEY_ALIAS: ${{ secrets.NART_KEY_ALIAS }}
          NART_KEY_PASSWORD: ${{ secrets.NART_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --console=plain
      - name: Prepare distributable APK and checksum
        env:
          VARIANT: ${{ inputs.variant || 'debug' }}
        run: |
          mkdir -p android-artifact
          cp "android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" "android-artifact/Nart-$VARIANT.apk"
          cd android-artifact
          sha256sum *.apk > SHA256SUMS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nart-android-${{ inputs.variant || 'debug' }}
          path: android-artifact/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/nart-release.jks"

  device-tests:
    if: inputs.device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web assets
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          cp .env.example .env
          npm run android:sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device tests and APK upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash scripts/test-android-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-reports-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
